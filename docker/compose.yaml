services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: phishguard-api:1.0.0
    container_name: phishguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - phishguard-data:/app/mlops/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  phishguard-data:
